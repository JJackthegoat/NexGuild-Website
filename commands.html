
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexGuild | Commands</title>

<style>
:root {
    --bg: #0b0e17;
    --card: #151a29;
    --border: #282e42;
    --accent: #6875ff;
    --text: #f5f6ff;
    --muted: #a1a9c0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 8%;
    border-bottom: 1px solid #252b3d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: var(--accent);
    text-decoration: none;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
}

nav a {
    color: var(--muted);
    text-decoration: none;
}

nav a:hover,
nav a.active {
    color: white;
}

main {
    max-width: 1100px;
    margin: 70px auto;
    padding: 0 20px;
}

h1 {
    font-size: 44px;
    margin-bottom: 12px;
}

.subtitle {
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 35px;
}

.search {
    width: 100%;
    padding: 17px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: white;
    font-size: 16px;
    outline: none;
}

.search:focus {
    border-color: var(--accent);
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 25px 0 35px;
}

.filter {
    background: #22283a;
    color: #c2c8db;
    border: 1px solid #30384e;
    padding: 11px 17px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.filter:hover {
    background: #30384e;
}

.filter.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.command-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(290px, 1fr)
    );
    gap: 18px;
}

.command {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 24px;
}

.command h2 {
    font-size: 19px;
    margin: 0 0 15px;
    color: #b4bcff;
    overflow-wrap: anywhere;
}

.command p {
    color: var(--muted);
    line-height: 1.6;
    min-height: 50px;
}

.meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.tag {
    background: #242b40;
    color: #c2c8db;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12px;
}

.message {
    color: var(--muted);
    text-align: center;
    padding: 35px;
}

footer {
    margin-top: 80px;
    padding: 35px;
    border-top: 1px solid #252b3d;
    color: var(--muted);
    text-align: center;
}

@media (max-width: 600px) {
    main {
        margin-top: 45px;
    }

    h1 {
        font-size: 34px;
    }

    .command-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <a class="logo" href="index.html">NexGuild</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="commands.html" class="active">Commands</a>
        <a href="status.html">Status</a>
        <a href="updates.html">Updates</a>
        <a href="support.html">Support</a>
    </nav>
</header>

<main>
    <h1>Commands</h1>

    <p class="subtitle">
        Explore NexGuild's commands and find the tools
        you need to manage your Discord community.
    </p>

    <input
        type="search"
        id="search"
        class="search"
        placeholder="Search commands..."
        aria-label="Search commands"
    >

    <div class="filters">
        <button class="filter active" data-filter="all">
            All Commands
        </button>

        <button class="filter" data-filter="moderation">
            Moderation
        </button>

        <button class="filter" data-filter="verification">
            Verification
        </button>

        <button class="filter" data-filter="suggestions">
            Suggestions
        </button>

        <button class="filter" data-filter="utility">
            Utility
        </button>
    </div>

    <div class="command-grid" id="commands"></div>

    <p class="message" id="message" role="status">
        Loading commands...
    </p>
</main>

<footer>
    © 2026 NexGuild. All rights reserved.
</footer>

<script>
const search = document.getElementById("search");
const filters = document.querySelectorAll(".filter");
const container = document.getElementById("commands");
const message = document.getElementById("message");

let activeCategory = "all";
let commandCards = [];

function createTag(value) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = value;
    return tag;
}

function updateCommands() {
    const query = search.value.trim().toLowerCase();
    let visible = 0;

    commandCards.forEach(card => {
        const matchesSearch =
            card.textContent.toLowerCase().includes(query);

        const matchesCategory =
            activeCategory === "all" ||
            card.dataset.category === activeCategory;

        const show = matchesSearch && matchesCategory;

        card.style.display = show ? "" : "none";

        if (show) {
            visible++;
        }
    });

    if (visible === 0) {
        message.textContent =
            "No commands found. Try another search or category.";
        message.style.display = "block";
    } else {
        message.style.display = "none";
    }
}

function createCommandCard(entry) {
    const card = document.createElement("article");
    card.className = "command";

    card.dataset.category =
        String(entry.category || "").toLowerCase();

    const title = document.createElement("h2");
    title.textContent = entry.name || "Unnamed command";

    const description = document.createElement("p");
    description.textContent = entry.description || "";

    const meta = document.createElement("div");
    meta.className = "meta";

    meta.appendChild(
        createTag(entry.category || "Other")
    );

    meta.appendChild(
        createTag(entry.permission || "Not specified")
    );

    card.append(title, description, meta);

    return card;
}

async function loadCommands() {
    message.textContent = "Loading commands...";
    message.style.display = "block";

    try {
        const response = await fetch(
            "data/commands.json",
            { cache: "no-cache" }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP error: " + response.status
            );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("Invalid command data");
        }

        container.replaceChildren();

        data.forEach(entry => {
            container.appendChild(
                createCommandCard(entry)
            );
        });

        commandCards = Array.from(
            container.querySelectorAll(".command")
        );

        updateCommands();

    } catch (error) {
        console.error("Failed to load commands:", error);

        message.textContent =
            "Unable to load commands right now. Please try again later.";

        message.style.display = "block";
    }
}

search.addEventListener("input", updateCommands);

filters.forEach(button => {
    button.addEventListener("click", () => {
        activeCategory = button.dataset.filter;

        filters.forEach(filter => {
            filter.classList.remove("active");
        });

        button.classList.add("active");

        updateCommands();
    });
});

loadCommands();
</script>

</body>
</html>
